<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B0C15" />
    <script>
      // Apply the saved theme before first paint so pages never flash the wrong colours
      (function () {
        try {
          var t = localStorage.getItem("meethive:theme");
          if (t !== "burgundy" && t !== "blush" && t !== "midnight") t = "burgundy";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "burgundy");
        }
      })();
    </script>
    <title>MeetHive – Free Online Video Meetings &amp; Video Calls in Your Browser</title>
    <meta name="description" content="MeetHive is a free video conferencing app. Start secure HD video meetings, share your screen and chat right in your browser – no downloads, guests join with just a code." />
    <meta name="keywords" content="MeetHive, free video meeting, video conferencing, online video call, video chat, screen sharing, browser video call, Google Meet alternative, Zoom alternative, WebRTC" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Luv Yadav" />
    <meta name="application-name" content="MeetHive" />

          "founder": { "@type": "Person", "name": "Luv Yadav" }
        },
        {
          "@type": "WebApplication",
          "name": "MeetHive",
          "url": "https://meethivefrontend.onrender.com/",

        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            { "@type": "Question", "name": "Is MeetHive free?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. MeetHive is free to use for video meetings, screen sharing and chat." } },
            { "@type": "Question", "name": "Do I need to download anything to use MeetHive?", "acceptedAnswer": { "@type": "Answer", "text": "No. MeetHive runs entirely in your web browser on desktop, tablet or phone." } },
            { "@type": "Question", "name": "Can guests join a MeetHive meeting without an account?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Anyone with the meeting code or link can join as a guest. You only need an account to start a meeting." } },
            { "@type": "Question", "name": "Are MeetHive video calls secure?", "acceptedAnswer": { "@type": "Answer", "text": "Media is sent encrypted between browsers using WebRTC with DTLS-SRTP." } },
