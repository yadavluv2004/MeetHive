<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B0C15" />
    <script>
      // Apply the saved theme before first paint so pages never flash the wrong colours
      (function () {
        try {
          var t = localStorage.getItem("meethive:theme");
          if (t !== "burgundy" && t !== "blush" && t !== "midnight") t = "burgundy";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "burgundy");
        }
      })();
    </script>
    <meta name="description" content="MeetHive - secure, free HD video meetings in your browser. No downloads required." />
    <meta property="og:title" content="MeetHive - Video meetings for everyone" />
    <meta property="og:description" content="Secure HD video calls, screen sharing and chat right in your browser." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>MeetHive - Video meetings for everyone</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run MeetHive.</noscript>
    <div id="root"></div>
  </body>
</html>
